version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: localgpt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-localgpt_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-localgpt_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localgpt_net

  # ----------------------------------------------------------------------------
  # FastAPI REST & SSE Streaming Backend
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localgpt_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PROJECT_NAME: "LocalGPT Cloud AI Platform"
      ENVIRONMENT: "production"
      DEBUG: "false"
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-localgpt_db}"
      DB_POOL_SIZE: "15"
      DB_MAX_OVERFLOW: "25"
      SECRET_KEY: ${SECRET_KEY:-localgpt-production-secret-key-change-in-prod}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      FRONTEND_URL: "http://localhost:3000"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: "http://localhost:8000/api/v1/auth/google/callback"
      GOOGLE_FRONTEND_REDIRECT_URI: "http://localhost:3000/auth/callback"
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY:-demo-key}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      UPLOAD_DIRECTORY: "/app/data/documents"
    ports:
      - "8000:8000"
    volumes:
      - backend_docs:/app/data/documents
      - backend_vectors:/app/data/vector_store
    networks:
      - localgpt_net

  # ----------------------------------------------------------------------------
  # Next.js 14 Web Application Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localgpt_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    ports:
      - "3000:3000"
    networks:
      - localgpt_net

volumes:
  postgres_data:
    driver: local
  backend_docs:
    driver: local
  backend_vectors:
    driver: local

networks:
  localgpt_net:
    driver: bridge
